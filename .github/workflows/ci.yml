name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install
      - run: bun test
      - run: bunx tsc --noEmit
      # The generated table must match src/upstreams.ts.
      - run: bun run upstreams:doc
      - run: git diff --exit-code UPSTREAMS.md
      # The real official installers, run the way setup runs them.
      - run: bun test/install-live.ts
